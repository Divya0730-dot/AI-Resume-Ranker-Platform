<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ResumeRanker AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #ff6b35; 
            --secondary: #f7931e; 
            --bg: #1a1a2e; 
            --card-bg: #16213e;
        }
        body { 
            background: linear-gradient(135deg, var(--bg), #0f3460); 
            color: #e2e8f0; 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
        }
        .admin-card { 
            background: rgba(22, 33, 62, 0.9); 
            backdrop-filter: blur(20px); 
            border: 2px solid var(--primary); 
            border-radius: 20px; 
            padding: 45px; 
            width: 100%; 
            max-width: 420px; 
            margin: auto;
            box-shadow: 0 0 40px rgba(255, 107, 53, 0.3);
        }
        .admin-title {
            color: var(--primary);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .admin-subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .form-label {
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .form-control { 
            background: rgba(15, 23, 42, 0.8); 
            border: 2px solid rgba(255, 107, 53, 0.3); 
            color: #fff; 
            border-radius: 12px; 
            padding: 15px; 
            transition: 0.4s;
            font-weight: 500;
        }
        .form-control:focus { 
            background: rgba(15, 23, 42, 0.9); 
            border-color: var(--primary); 
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.4); 
            color: #fff;
        }
        .form-control::placeholder {
            color: #64748b;
        }
        .input-group-text { 
            background: rgba(15, 23, 42, 0.8); 
            border: 2px solid rgba(255, 107, 53, 0.3); 
            border-left: none; 
            cursor: pointer; 
            color: var(--primary);
            transition: 0.3s;
        }
        .input-group-text:hover {
            background: rgba(255, 107, 53, 0.1);
        }
        .btn-admin { 
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none; 
            border-radius: 12px; 
            padding: 15px; 
            font-weight: 700;
            color: white; 
            width: 100%; 
            transition: 0.3s; 
            margin-top: 25px;
            text-transform: uppercase; 
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.3);
        }
        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.5);
        }
        .alert-custom { 
            background: rgba(255, 75, 92, 0.15); 
            border: 1px solid #ff4b5c; 
            color: #ff4b5c; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            font-size: 0.9rem; 
            text-align: center;
            font-weight: 500;
        }
        .alert-success {
            background: rgba(0, 255, 136, 0.15);
            border-color: #00ff88;
            color: #00ff88;
        }
        .footer-text { 
            color: #94a3b8; 
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
        }
        .footer-link { 
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 600; 
            margin-left: 5px;
        }
        .footer-link:hover {
            color: var(--secondary);
        }
        .admin-icon {
            font-size: 3rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="admin-card">
        <div class="admin-icon">
            <i class="fas fa-user-shield"></i>
        </div>
        <h2 class="admin-title">Admin Access</h2>
        <p class="admin-subtitle">Secure administrative login portal</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert-custom"> <i class="fa fa-shield-alt me-2"></i> {{ message }} </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form id="adminLoginForm">
            <div class="mb-4">
                <label for="adminUsername" class="form-label">
                    <i class="fas fa-user me-2"></i>Username
                </label>
                <input type="text" name="username" id="adminUsername" class="form-control" placeholder="Enter admin username" required>
            </div>
            <div class="mb-4">
                <label for="adminPassword" class="form-label">
                    <i class="fas fa-lock me-2"></i>Password
                </label>
                <div class="input-group">
                    <input type="password" id="adminPassword" name="password" class="form-control" placeholder="Enter admin password" style="border-right:none;" required>
                    <span class="input-group-text" onclick="toggleAdminPassword()">
                        <i class="fa fa-eye" id="adminPasswordIcon"></i>
                    </span>
                </div>
            </div>
            <button type="submit" id="adminLoginBtn" class="btn btn-admin">
                <i class="fas fa-sign-in-alt me-2"></i>Admin Login
            </button>
        </form>

        <div class="footer-text">
            <i class="fas fa-users me-2"></i>Recruiter Login?
            <a href="/login" class="footer-link">Click Here</a>
        </div>
    </div>

    <script>
        function toggleAdminPassword() {
            const passwordField = document.getElementById('adminPassword');
            const passwordIcon = document.getElementById('adminPasswordIcon');
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                passwordIcon.classList.remove('fa-eye');
                passwordIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                passwordIcon.classList.remove('fa-eye-slash');
                passwordIcon.classList.add('fa-eye');
            }
        }

        // Handle admin login form submission
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value;
            const loginBtn = document.getElementById('adminLoginBtn');

            // Basic client-side validation
            if (!username || !password) {
                showAdminError('Please enter both username and password');
                return;
            }

            try {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>AUTHENTICATING...';

                // Remove any existing error messages
                const existingAlert = document.querySelector('.alert-custom');
                if (existingAlert) {
                    existingAlert.remove();
                }

                const response = await fetch('/api/admin-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    // Success - show success message briefly then redirect
                    showAdminSuccess('Admin login successful! Redirecting to dashboard...');
                    setTimeout(() => {
                        window.location.href = '/admin-dashboard';
                    }, 1500);
                } else {
                    // Error - show error message and stay on page
                    showAdminError(result.error);
                    
                    // Clear password field for security
                    document.getElementById('adminPassword').value = '';
                    document.getElementById('adminUsername').focus();
                }
            } catch (error) {
                console.error('Admin login error:', error);
                showAdminError('Login failed. Please check your connection and try again.');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Admin Login';
            }
        });

        function showAdminError(message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert-custom';
            alertDiv.innerHTML = '<i class="fa fa-shield-alt me-2"></i> ' + message;
            
            const form = document.getElementById('adminLoginForm');
            form.parentNode.insertBefore(alertDiv, form);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.remove();
                }
            }, 5000);
        }

        function showAdminSuccess(message) {
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert-custom alert-success';
            alertDiv.innerHTML = '<i class="fa fa-check-shield me-2"></i> ' + message;
            
            const form = document.getElementById('adminLoginForm');
            form.parentNode.insertBefore(alertDiv, form);
        }
    </script>
</body>
</html>
